name: Import Ballpark Cribbage launch package
on:
  push:
    branches: [main]
    paths:
      - 'Ballpark_Cribbage_121_Launch_Ready.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack complete game source
        shell: bash
        run: |
          test -f Ballpark_Cribbage_121_Launch_Ready.zip || { echo "Upload Ballpark_Cribbage_121_Launch_Ready.zip to the repository root first."; exit 1; }
          unzip -oq Ballpark_Cribbage_121_Launch_Ready.zip -d .
          test -f package.json && test -f server.js && test -f game.js && test -f public/index.html
          rm Ballpark_Cribbage_121_Launch_Ready.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game rules and multiplayer tests
        run: npm test
      - name: Publish unpacked game source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -m "Deploy complete World Series Cribbage game"
          git push origin HEAD:main
